server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/algoclash}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# HikariCP — Neon free tier allows ~5 concurrent connections
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

jwt.secret=${JWT_SECRET:6F586D5A7134743777217A25432A462D4A614E645267556B5870327335763879}
jwt.expiration.hours=${JWT_EXPIRATION_HOURS:24}

app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:*}

judge0.url=${JUDGE0_URL:http://localhost:2358}
judge0.api-key=${JUDGE0_API_KEY:}

# Resilience4j — Judge0 retry (3 attempts, 500ms wait)
resilience4j.retry.instances.judge0.max-attempts=3
resilience4j.retry.instances.judge0.wait-duration=500ms
resilience4j.retry.instances.judge0.retry-exceptions=org.springframework.web.client.RestClientException

# Resilience4j — Judge0 circuit breaker (opens after 5 failures, resets after 30s)
resilience4j.circuitbreaker.instances.judge0.sliding-window-size=5
resilience4j.circuitbreaker.instances.judge0.failure-rate-threshold=80
resilience4j.circuitbreaker.instances.judge0.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.judge0.permitted-number-of-calls-in-half-open-state=2
