# Render Blueprint — deploy backend as a Docker web service
# Docs: https://docs.render.com/blueprint-spec
services:
  - type: web
    name: algoclash-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        sync: false          # set in Render dashboard
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true  # auto-generate a secure random value
      - key: JWT_EXPIRATION_HOURS
        value: 24
      - key: APP_CORS_ALLOWED_ORIGIN
        sync: false          # set to your Vercel frontend URL
      - key: JUDGE0_URL
        value: https://api.onlinecompiler.io/api/judge0
      - key: JUDGE0_API_KEY
        sync: false          # set your free OnlineCompiler.io API key in Render dashboard
