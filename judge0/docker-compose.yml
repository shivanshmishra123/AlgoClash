version: '3.8'

services:
  server:
    image: judge0/judge0:latest
    volumes:
      - ./judge0.conf:/etc/judge0.conf:ro
    ports:
      - "2358:2358"
    privileged: true
    depends_on:
      - judge0-db
      - judge0-redis

  worker:
    image: judge0/judge0:latest
    command: ["./scripts/worker"]
    volumes:
      - ./judge0.conf:/etc/judge0.conf:ro
    privileged: true
    depends_on:
      - judge0-db
      - judge0-redis

  judge0-db:
    image: postgres:13
    environment:
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0_password
      POSTGRES_DB: judge0

  judge0-redis:
    image: redis:6
